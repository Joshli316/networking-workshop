<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Apple Touch Icon — Networking Workshop</title>
<style>
  :root { --primary: #047857; --primary-dark: #064e3b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 360px; height: 360px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  body::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 30%, rgba(110,231,183,0.20) 0%, transparent 60%);
  }
  .icon {
    color: #ecfdf5; width: 210px; height: 210px;
    position: relative; z-index: 1;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,0.35));
  }
</style>
</head>
<body>
  <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
    <circle cx="9" cy="7" r="4"></circle>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
  </svg>
</body>
</html>
